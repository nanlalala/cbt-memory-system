name: CPU regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Official actions/* tag refs verified on 2026-10-19; runtime uses immutable commits.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-test.lock
      - run: >-
          python -m pip --isolated install --require-hashes --only-binary=:all:
          --index-url https://pypi.org/simple -r requirements-test.lock
      - run: python -m pip check
      - run: python -m compileall -q modules evaluation app tests
      - run: python -m unittest discover -s tests -v
      - run: python app/memory_demo.py --scripted
      - run: python evaluation/end-to-end-dialogue/verify_pilot_audit.py
      - run: python evaluation/memory-retrieval/verify_pinned_retrieval.py
