<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1200" viewBox="0 0 1120 1200" role="img" aria-labelledby="title desc">
<title id="title">CBT memory readout and actual message assembly</title>
<desc id="desc">Original source and versioned memory are filtered, ranked and packed into a user-role reference block after stable policy and recent dialogue. A separate audit trace remains outside the model context. Professional CBT knowledge is optional typed reference data.</desc>
